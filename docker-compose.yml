services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: devotion
      POSTGRES_PASSWORD: devotion
      POSTGRES_DB: devotion_dev
    ports:
      - "5432:5432"
    volumes:
      - devotion_pg_data:/var/lib/postgresql/data

volumes:
  devotion_pg_data:
